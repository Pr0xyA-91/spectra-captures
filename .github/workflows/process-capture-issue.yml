name: Auto-Process Capture Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

# Serialize runs writing to main so simultaneous opened+labeled events never race on git push
concurrency:
  group: process-capture-main
  cancel-in-progress: false

jobs:
  process-capture:
    if: >-
      github.event.issue.state == 'open' &&
      (
        (github.event.action == 'opened' && (
          contains(github.event.issue.labels.*.name, 'capture') ||
          startsWith(github.event.issue.title, '[Capture]') ||
          startsWith(github.event.issue.title, '[Offset Fix + Capture]')
        )) ||
        (github.event.action == 'labeled' && github.event.label.name == 'capture')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is still open
        id: check_open
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            core.setOutput('is_open', issue.state === 'open' ? 'true' : 'false');
            if (issue.state !== 'open') {
              core.notice(`Issue #${context.issue.number} is already closed (handled by an earlier run). Skipping cleanly.`);
            }

      - name: Check out repo
        if: steps.check_open.outputs.is_open == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.check_open.outputs.is_open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract and Ingest Capture Payload
        if: steps.check_open.outputs.is_open == 'true'
        id: ingest
        run: python3 scripts/ingest_capture_issue.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-index Captures Catalog
        if: steps.check_open.outputs.is_open == 'true'
        run: python3 scripts/index_captures.py

      - name: Commit & Push New Capture
        if: steps.check_open.outputs.is_open == 'true'
        env:
          MODEL_NAME: ${{ steps.ingest.outputs.model_name }}
        run: |
          git config user.name "spectra-telemetry-bot[bot]"
          git config user.email "bot@spectra.local"
          git add captures/ INDEX.json README.md
          if git status --porcelain | grep -q .; then
            git commit -m "feat(telemetry): integrate ${MODEL_NAME} capture [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close Issue with Confirmation
        if: steps.check_open.outputs.is_open == 'true'
        uses: actions/github-script@v7
        env:
          MODEL_NAME: ${{ steps.ingest.outputs.model_name }}
          DEST_PATH: ${{ steps.ingest.outputs.dest_path }}
        with:
          script: |
            const model = process.env.MODEL_NAME || 'Unknown';
            const file = process.env.DEST_PATH || '';
            const comment = `### ✅ Telemetry Capture Ingested Successfully!\n\n` +
              `Thank you for contributing to the SPECTRA community telemetry database!\n\n` +
              `- **Target Model**: \`${model}\`\n` +
              `- **Cataloged File**: \`${file}\`\n` +
              `- **Database Index**: Updated in [\`INDEX.json\`](https://github.com/Pr0xyA-91/spectra-captures/blob/main/INDEX.json)\n\n` +
              `Engineering will review this capture to calibrate beverage and maintenance register offsets for upcoming SPECTRA releases.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
