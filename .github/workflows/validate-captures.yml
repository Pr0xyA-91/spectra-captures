name: Validate Captures & Update Index

on:
  push:
    branches: [ main ]
    paths:
      - 'captures/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'captures/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Schema Validation & Indexing
        run: |
          python3 scripts/index_captures.py
      - name: Check for Clean Working Tree
        run: |
          git diff --exit-code INDEX.json || (echo "INDEX.json out of date. Please commit the updated INDEX.json generated by scripts/index_captures.py" && exit 1)
