name: Validate Captures & Update Index

on:
  push:
    branches: [ main ]
    paths:
      - 'captures/**'
      - 'scripts/**'
      - 'tests/**'
      - 'INDEX.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'captures/**'
      - 'scripts/**'
      - 'tests/**'
      - 'INDEX.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Strict Hex, Size & Security Payload Scan
        run: python3 scripts/validate_payload.py --scan-repo --strict
      - name: Verify INDEX.json Freshness
        run: python3 scripts/index_captures.py --check
      - name: Run Security & Validation Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
